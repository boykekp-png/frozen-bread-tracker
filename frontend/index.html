<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frozen Bread Tracker - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="auth-container">
            <div class="logo">
                <div style="display:flex; justify-content:flex-end; margin-bottom:10px;">
                    <button id="theme-toggle" class="btn btn-secondary" title="Toggle dark mode" onclick="toggleTheme()">🌙</button>
                </div>
                <h1>🍞 Frozen Bread Tracker</h1>
                <p>Track your frozen bread expiration dates</p>
            </div>

            <div class="tabs">
                <button class="tab-btn active" data-tab="login">Login</button>
                <button class="tab-btn" data-tab="register">Register</button>
                <button class="tab-btn" data-tab="forgot">Forgot Password</button>
                <button class="tab-btn" data-tab="reset">Reset Password</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form active">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" name="email" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" required placeholder="Enter your password">
                </div>
                <div class="error-message" id="login-error"></div>
                <button type="submit" class="btn btn-primary">Login</button>
                <button type="button" class="btn btn-secondary" id="show-forgot" style="margin-top:10px; width:100%;">Forgot Password?</button>
            </form>

            <form id="forgot-form" class="auth-form">
                <div class="form-group">
                    <label for="forgot-email">Email</label>
                    <input type="email" id="forgot-email" required placeholder="Enter your email">
                </div>
                <div class="error-message" id="forgot-error"></div>
                <button type="submit" class="btn btn-primary">Request Reset Token</button>
            </form>

            <form id="reset-form" class="auth-form">
                <div class="form-group">
                    <label for="reset-token">Reset Token</label>
                    <input type="text" id="reset-token" required placeholder="Paste reset token">
                </div>
                <div class="form-group">
                    <label for="reset-password">New Password</label>
                    <input type="password" id="reset-password" required minlength="6" placeholder="Enter new password">
                </div>
                <div class="error-message" id="reset-error"></div>
                <button type="submit" class="btn btn-primary">Reset Password</button>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="auth-form">
                <div class="form-group">
                    <label for="register-name">Name</label>
                    <input type="text" id="register-name" name="name" required placeholder="Enter your name">
                </div>
                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" name="email" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="register-password">Password</label>
                    <input type="password" id="register-password" name="password" required placeholder="Create a password (min 6 characters)">
                </div>
                <div class="form-group">
                    <label for="register-confirm">Confirm Password</label>
                    <input type="password" id="register-confirm" name="confirm" required placeholder="Confirm your password">
                </div>
                <div class="error-message" id="register-error"></div>
                <button type="submit" class="btn btn-primary">Register</button>
            </form>
        </div>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
