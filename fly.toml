app = "frozen-bread-tracker"
primary_region = "iad"

[build]

[env]
NODE_ENV = "production"

[[mounts]]
source = "data"
destination = "/data"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 0

[[vm]]
memory = "256mb"
cpu_kind = "shared"
cpus = 1